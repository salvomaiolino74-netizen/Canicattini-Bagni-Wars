<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canicattini Bagni 3D - Vehicles, Shop & Local Easter Eggs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
    html, body {
      width: 100%; height: 100%;
      background-color: #0b0f19;
      color: #fff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game-canvas { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* --- MENU PRINCIPALE --- */
    #main-menu {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 15, 25, 0.98);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      transition: opacity 0.4s ease;
    }
    .menu-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #f59e0b;
      text-align: center;
      text-shadow: 0 4px 20px rgba(245, 158, 11, 0.5);
    }
    .menu-subtitle {
      font-size: 1rem;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .btn-play {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 14px 48px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
      -webkit-tap-highlight-color: transparent;
    }
    .btn-play:active { transform: scale(0.95); }

    /* --- MENU PAUSA --- */
    #pause-menu {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 90;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #pause-menu.visible { opacity: 1; pointer-events: auto; }

    /* --- NEGOZIO PERSONALIZZAZIONE --- */
    #shop-menu {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(10px);
      z-index: 95;
      display: flex;
      flex-direction: column;
      justify-content: center;
