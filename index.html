<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canicattini Bagni 3D - Fixed Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #fff;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #game-canvas { width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* --- MENU PRINCIPALE --- */
    #main-menu {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
      transition: opacity 0.5s ease;
    }
    #main-menu.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .menu-title {
      font-size: 2rem;
      font-weight: 900;
      color: #f59e0b;
      text-align: center;
      text-shadow: 0 4px 20px rgba(245, 158, 11, 0.5);
    }
    .menu-subtitle {
      font-size: 0.95rem;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .btn-play {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000;
      font-size: 1.2rem;
      font-weight: 800;
      padding: 12px 42px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.4);
    }
    .btn-play:active { transform: scale(0.95); }

    /* --- MENU PAUSA --- */
    #pause-menu {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      z-index: 90;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #pause-menu.visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* --- BARRA RESISTENZA --- */
    .stamina-container {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 4px;
      z-index: 20;
      display: none;
      flex-direction: column;
      align-items: center;
    }
    .stamina-label { font-size: 0.65rem; font-weight: bold; color: #94a3b8; margin-bottom: 2px; }
    .stamina-bar-bg { width: 100%; height: 6px; background: #334155; border-radius: 3px; overflow: hidden; }
    .stamina-bar-fill { width: 100%; height: 100%; background: #3b82f6; transition: width 0.1s linear; }

    /* --- INTERFACCIA HUD --- */
    .ui-layer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 12px 18px;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .ui-layer.visible { opacity: 1; }
    .interactive { pointer-events: auto; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; }
    .top-left-group { display: flex; gap: 10px; align-items: center; }
    .hud-box {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: bold;
    }
    .district-hud {
      background: #dc2626;
      color: white;
      padding: 5px 12px;
      border-radius: 16px;
      font-size: 0.8rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    #minimap {
      width: 80px; height: 80px;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      overflow: hidden;
    }
    #minimap-canvas { width: 100%; height: 100%; display: block; }

    .btn-pause {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      width: 38px; height: 38px;
      border-radius: 50%;
      display: flex; justify-content: center; align-items: center;
    }

    .controls-panel {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }
    .touch-joystick {
      width: 100px; height: 100px;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      position: relative;
    }
    .joystick-stick {
      width: 40px; height: 40px;
      background: #f59e0b;
      border-radius: 50%;
      position: absolute;
      top: 30px; left: 30px;
    }
    .action-grid { display: flex; gap: 8px; align-items: center; }
    .btn-action {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.4);
      background: rgba(15, 23, 42, 0.85);
      color: white;
      font-size: 1rem;
      display: flex; justify-content: center; align-items: center;
    }
    .btn-action:active { transform: scale(0.9); }
  </style>
</head>
<body>

  <div id="main-menu">
    <div class="menu-title">PET WARS 3D<br><span style="font-size:1.1rem; color:#fff;">Canicattini Bagni</span></div>
    <div class="menu-subtitle">Meteo, Nuoto e Veicoli 3D</div>
    <button class="btn-play" onclick="startGame()">GIOCA</button>
  </div>

  <div id="pause-menu" class="interactive">
    <h2 style="color:#fff; margin-bottom:15px;">PAUSA</h2>
    <button class="btn-play" onclick="resumeGame()">RIPRENDI</button>
  </div>

  <div class="stamina-container" id="stamina-container">
    <div class="stamina-label" id="stamina-label">Resistenza</div>
    <div class="stamina-bar-bg">
      <div class="stamina-bar-fill" id="stamina-fill"></div>
    </div>
  </div>

  <canvas id="game-canvas"></canvas>

  <div class="ui-layer" id="ui-layer">
    <div class="top-bar">
      <div class="top-left-group">
        <div id="minimap"><canvas id="minimap-canvas" width="80" height="80"></canvas></div>
        <div class="hud-box">🐾 <span id="player-evo">Cane Randagio</span> | 🪙 <span id="player-coins" style="color:#f59e0b;">150</span></div>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">
        <div class="district-hud" id="current-district">Matrice</div>
        <button class="btn-pause interactive" onclick="pauseGame()">⏸️</button>
      </div>
    </div>

    <div class="controls-panel">
      <div class="touch-joystick interactive" id="joystick-zone">
        <div class="joystick-stick" id="joystick-stick"></div>
      </div>
      <div class="action-grid interactive">
        <button class="btn-action" style="background:#3b82f6;" ontouchstart="startRunning()" ontouchend="stopRunning()" onmousedown="startRunning()" onmouseup="stopRunning()">🏃‍♂️</button>
        <button class="btn-action" style="background:#dc2626;" onclick="actionPunch()">🥊</button>
        <button class="btn-action" style="background:#eab308;" onclick="actionJump()">🦘</button>
        <button class="btn-action" style="background:#16a34a;" onclick="actionBuild()">🏗️</button>
        <button class="btn-action" style="background:#8b5cf6;" onclick="actionEvolve()">✨</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let gameStarted = false;
    let isPaused = false;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playSound(type) {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;
        if (type === 'jump') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(350, now + 0.15);
          gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
          osc.start(now); osc.stop(now + 0.15);
        } else if (type === 'punch') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(120, now); osc.frequency.linearRampToValueAtTime(40, now + 0.1);
          gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
          osc.start(now); osc.stop(now + 0.1);
        } else if (type === 'hit') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(100, now); osc.frequency.linearRampToValueAtTime(30, now + 0.3);
          gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
          osc.start(now); osc.stop(now + 0.3);
        }
      } catch(e) {}
    }

    let isRunningPressed = false;
    let stamina = 100;
    let isExhausted = false;
    let isHitByVehicle = false;
    let hitAnimTimer = 0;

    function startRunning() { if (!isExhausted && !isHitByVehicle) isRunningPressed = true; }
    function stopRunning() { isRunningPressed = false; }

    function startGame() {
      if (gameStarted) return;
      initAudio();
      gameStarted = true;
      const menu = document.getElementById('main-menu');
      menu.classList.add('fade-out');
      setTimeout(() => {
        menu.style.display = 'none';
        document.getElementById('ui-layer').classList.add('visible');
        document.getElementById('stamina-container').style.display = 'flex';
      }, 500);
    }

    function pauseGame() { isPaused = true; document.getElementById('pause-menu').classList.add('visible'); }
    function resumeGame() { isPaused = false; document.getElementById('pause-menu').classList.remove('visible'); }

    // --- INIZIALIZZAZIONE GIOCO ---
    function initGame() {
      const canvas = document.getElementById('game-canvas');
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x1a1e29, 0.003);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      const ambientLight = new THREE.AmbientLight(0xffedd5, 0.9);
      scene.add(ambientLight);

      const sunLight = new THREE.DirectionalLight(0xffb020, 1.2);
      sunLight.position.set(150, 150, 150);
      scene.add(sunLight);

      // Terreno
      const groundGeo = new THREE.PlaneGeometry(1000, 1000);
      const groundMat = new THREE.MeshStandardMaterial({ color: 0x1e222b, roughness: 0.8 });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      // Spiaggia e Mare
      const beach = new THREE.Mesh(new THREE.PlaneGeometry(400, 150), new THREE.MeshStandardMaterial({ color: 0xd9b382 }));
      beach.rotation.x = -Math.PI / 2; beach.position.set(0, 0.1, 400); scene.add(beach);

      const sea = new THREE.Mesh(new THREE.PlaneGeometry(800, 300), new THREE.MeshStandardMaterial({ color: 0x0284c7, transparent: true, opacity: 0.8 }));
      sea.rotation.x = -Math.PI / 2; sea.position.set(0, -0.2, 600); scene.add(sea);

      // Pioggia
      const rainCount = 500;
      const rainGeo = new THREE.BufferGeometry();
      const rainPos = new Float32Array(rainCount * 3);
      for (let i = 0; i < rainCount * 3; i += 3) {
        rainPos[i] = (Math.random() - 0.5) * 400;
        rainPos[i+1] = Math.random() * 150;
        rainPos[i+2] = (Math.random() - 0.5) * 400;
      }
      rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
      const rainSystem = new THREE.Points(rainGeo, new THREE.PointsMaterial({ color: 0x93c5fd, size: 1 }));
      scene.add(rainSystem);

      // Edifici Quartieri
      const DISTRICTS = [
        { name: 'Matrice', x: 0, z: -100, radius: 70, color: '#ef4444' },
        { name: 'San Giovanni', x: -140, z: -40, radius: 60, color: '#f59e0b' },
        { name: 'Badune', x: 140, z: -40, radius: 60, color: '#3b82f6' }
      ];

      const buildingColliders = [];
      DISTRICTS.forEach(d => {
        for (let i = 0; i < 5; i++) {
          const angle = (i / 5) * Math.PI * 2;
          const dist = 25 + Math.random() * 20;
          const w = 12 + Math.random() * 6, h = 20 + Math.random() * 15, l = 12 + Math.random() * 6;
          const bMat = new THREE.MeshStandardMaterial({ color: i % 2 === 0 ? 0xd4a373 : 0x778da9 });
          const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), bMat);
          const px = d.x + Math.cos(angle) * dist, pz = d.z + Math.sin(angle) * dist;
          b.position.set(px, h / 2, pz);
          scene.add(b);
          buildingColliders.push({ minX: px - w/2 - 1, maxX: px + w/2 + 1, minZ: pz - l/2 - 1, maxZ: pz + l/2 + 1 });
        }
      });

      // Veicoli (Auto e Moto)
      const vehicles = [];
      for (let i = 0; i < 4; i++) {
        const isMoto = i % 2 !== 0;
        const vMesh = new THREE.Mesh(
          isMoto ? new THREE.BoxGeometry(1.2, 1.2, 3.5) : new THREE.BoxGeometry(3.5, 1.4, 6),
          new THREE.MeshStandardMaterial({ color: isMoto ? 0x111827 : (i === 0 ? 0xdc2626 : 0x2563eb) })
        );
        vMesh.position.set(-200 + i * 100, 0.7, i % 2 === 0 ? -15 : 20);
        scene.add(vMesh);
        vehicles.push({ mesh: vMesh, speed: isMoto ? 1.5 : 0.9, minX: -250, maxX: 250 });
      }

      // Giocatore
      const playerGroup = new THREE.Group();
      const pMat = new THREE.MeshStandardMaterial({ color: 0xd97706 });
      const torso = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.4, 1), pMat); torso.position.y = 2.4; playerGroup.add(torso);
      const head = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.3, 1.3), pMat); head.position.y = 4.2; playerGroup.add(head);
      scene.add(playerGroup);

      let cameraYaw = 0, moveInput = { x: 0, y: 0 }, velocityY = 0, isGrounded = true;

      // Joystick
      const joystickZone = document.getElementById('joystick-zone');
      const joystickStick = document.getElementById('joystick-stick');
      let touchId = null;

      joystickZone.addEventListener('touchstart', e => {
        e.stopPropagation();
        const t = e.changedTouches[0]; touchId = t.identifier; updateJ(t);
      });
      window.addEventListener('touchmove', e => {
        for (let t of e.changedTouches) { if (t.identifier === touchId) updateJ(t); }
      });
      window.addEventListener('touchend', e => {
        for (let t of e.changedTouches) {
          if (t.identifier === touchId) {
            touchId = null; moveInput = { x: 0, y: 0 };
            joystickStick.style.top = '30px'; joystickStick.style.left = '30px';
          }
        }
      });

      function updateJ(t) {
        const rect = joystickZone.getBoundingClientRect();
        const dx = t.clientX - (rect.left + rect.width / 2), dy = t.clientY - (rect.top + rect.height / 2);
        const dist = Math.min(35, Math.hypot(dx, dy)), angle = Math.atan2(dy, dx);
        joystickStick.style.left = `${30 + Math.cos(angle) * dist}px`;
        joystickStick.style.top = `${30 + Math.sin(angle) * dist}px`;
        moveInput.x = (Math.cos(angle) * dist) / 35; moveInput.y = (Math.sin(angle) * dist) / 35;
      }

      window.actionJump = function() {
        if (!isPaused && isGrounded && !isHitByVehicle) { velocityY = 0.45; isGrounded = false; playSound('jump'); }
      };
      window.actionPunch = function() { if (!isPaused && !isHitByVehicle) playSound('punch'); };
      window.actionBuild = function() {};
      window.actionEvolve = function() {};

      function checkCol(x, z) {
        return buildingColliders.some(b => x > b.minX && x < b.maxX && z > b.minZ && z < b.maxZ);
      }

      // Loop di Animazione
      let lastTime = performance.now();
      function animate() {
        requestAnimationFrame(animate);
        const now = performance.now();
        const delta = Math.min((now - lastTime) / 1000, 0.1);
        lastTime = now;

        if (gameStarted && !isPaused) {
          // Movimento Pioggia
          const p = rainGeo.attributes.position.array;
          for (let i = 1; i < p.length; i += 3) {
            p[i] -= 3; if (p[i] < 0) p[i] = 150;
          }
          rainGeo.attributes.position.needsUpdate = true;

          // Movimento Veicoli
          vehicles.forEach(v => {
            v.mesh.position.x += v.speed;
            if (v.mesh.position.x > v.maxX) v.mesh.position.x = v.minX;
            if (!isHitByVehicle && Math.hypot(playerGroup.position.x - v.mesh.position.x, playerGroup.position.z - v.mesh.position.z) < 3.5) {
              isHitByVehicle = true; hitAnimTimer = 40; isRunningPressed = false; playSound('hit');
            }
          });

          if (isHitByVehicle) {
            hitAnimTimer--;
            playerGroup.position.x -= 0.5;
            playerGroup.rotation.z = Math.sin(hitAnimTimer * 0.4) * 1.2;
            if (hitAnimTimer <= 0) { isHitByVehicle = false; playerGroup.rotation.z = 0; }
          } else {
            const isMoving = Math.hypot(moveInput.x, moveInput.y) > 0.1;
            let speed = 0.8;
            if (isMoving && isRunningPressed && !isExhausted) {
              speed = 1.6; stamina -= (delta / 7) * 100;
              if (stamina <= 0) { stamina = 0; isExhausted = true; isRunningPressed = false; }
            } else {
              stamina = Math.min(100, stamina + (100 / 7) * delta);
              if (stamina >= 100) isExhausted = false;
            }

            const fill = document.getElementById('stamina-fill');
            if (fill) fill.style.width = stamina + '%';

            if (isMoving) {
              const nx = playerGroup.position.x + moveInput.x * speed;
              const nz = playerGroup.position.z + moveInput.y * speed;
              if (!checkCol(nx, playerGroup.position.z)) playerGroup.position.x = nx;
              if (!checkCol(playerGroup.position.x, nz)) playerGroup.position.z = nz;
              playerGroup.rotation.y = Math.atan2(moveInput.x, moveInput.y);
            }

            if (playerGroup.position.z > 480) {
              playerGroup.position.y = -0.2 + Math.sin(now * 0.005) * 0.3; // Nuoto
            } else if (!isGrounded || velocityY !== 0) {
              playerGroup.position.y += velocityY; velocityY -= 0.018;
              if (playerGroup.position.y <= 0) { playerGroup.position.y = 0; velocityY = 0; isGrounded = true; }
            }
          }
        }

        // Telecamera
        camera.position.x = playerGroup.position.x - Math.sin(cameraYaw) * 18;
        camera.position.z = playerGroup.position.z - Math.cos(cameraYaw) * 18;
        camera.position.y = playerGroup.position.y + 10;
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 2, playerGroup.position.z);

        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    }

    // Avvio sicuro all'apertura della pagina
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      initGame();
    } else {
      window.addEventListener('DOMContentLoaded', initGame);
    }
  </script>
</body>
</html>
